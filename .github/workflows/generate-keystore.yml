name: Generate Keystore (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.jks \
            -alias niksamgenerators \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass NiksamGen@2026Secure \
            -keypass NiksamGen@2026Secure \
            -dname "CN=NiksamGenerators, OU=NiksamGenerators, O=NiksamGenerators, L=Tehran, S=Tehran, C=IR"

      - name: Commit keystore into the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/release.jks
          git commit -m "Add release keystore for signing" || echo "Nothing to commit"
          git push
